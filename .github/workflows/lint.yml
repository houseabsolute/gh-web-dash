name: Lint

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CRATE_NAME: gh-web-dash
  RUST_BACKTRACE: 1

# There's not much value in running self-check on multiple platforms. Either
# we're lint-clean or not. We do run on each rust target to catch warnings
# coming from clippy in future rust versions.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read # to check out the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runners ship rustup, so there is no need for a third-party action here.
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update \
            --component clippy --component rustfmt
          rustup default stable
      # This has to come after the toolchain is selected, since rust-cache keys
      # its cache off the active rustc version.
      - name: Cache cargo & target directories
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install mise
        run: |
          set -e
          set -x
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install tools
        run: mise install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run precious lint --all
        run: mise exec -- precious --debug lint --all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
