name: Security audit - nightly

on:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # This job's product is a filed advisory issue, not a status check, so a
  # cancelled run drops work rather than being superseded by the next one.
  cancel-in-progress: false

permissions: {}

jobs:
  security_audit:
    name: Security audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read # to check out the repo
      checks: write # the audit action reports findings as a check run
      issues: write # the audit action files an issue for each advisory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
