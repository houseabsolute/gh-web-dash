[tools]
just = "1.59.0"
# oxfmt is an npm package, so it needs a node runtime. Without this the
# container has no node and oxfmt dies with exit 127 — GitHub runners happen to
# ship node, so CI does not notice.
node = "26.13.0"
"npm:@devcontainers/cli" = "0.90.0"
"npm:oxfmt" = "0.75.0"
typos = "1.51.1"
zizmor = "1.31.1"
"cargo:cargo-edit" = "0.13.14"
"github:houseabsolute/omegasort" = "0.2.1"
"github:houseabsolute/precious" = "1.0.0"

[settings]
minimum_release_age = "3d"
